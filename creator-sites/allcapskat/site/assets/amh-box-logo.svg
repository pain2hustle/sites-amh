<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Artificial Mind Hive UFO logo</title>
  <desc id="desc">The gold AMH mark framed beneath two small flying saucers.</desc>
  <defs>
