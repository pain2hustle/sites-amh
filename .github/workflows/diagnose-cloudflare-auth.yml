name: Diagnose Cloudflare Pages auth (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-auth-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.repository == 'pain2hustle/sites-amh' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out reviewed diagnostic
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: One read-only Pages authentication check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 tools/diagnose_cloudflare_pages_auth.py
