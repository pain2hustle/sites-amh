name: Deploy Ari (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ari1of1-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'pain2hustle/sites-amh' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Build only the reviewed Ari site
        run: python3 build_ari_standalone.py --output _ari_site

      - name: Use supported Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Verify account and ensure the exact authorized Ari project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 tools/verify_ari_pages_project.py

      - name: Deploy only ari1of1 production
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        env:
          WRANGLER_SEND_METRICS: 'false'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: a08783a0d3715df907ed5ccad38f0dcf
          wranglerVersion: '4.136.3'
          command: pages deploy _ari_site --project-name=ari1of1 --branch=main --commit-hash=${{ github.sha }}

      - name: Record the exact production destination
        run: |
          printf '%s\n' 'Ari deployment upload completed.' 'Production destination: https://ari1of1.pages.dev/' 'Public rendering, assets and video fallback QA must be verified before declaring the page complete.' >> "$GITHUB_STEP_SUMMARY"
